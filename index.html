<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Real Calculator</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


    <div class="calculator">


        <!-- Calculator Heading -->

        <h2>Calculator</h2>


        <!-- Display -->

        <div class="display-container">

            <div id="previous-display"></div>

            <input
                type="text"
                id="display"
                placeholder="0"
                readonly
            >

        </div>



        <!-- Calculator Buttons -->

        <div class="buttons">


            <!-- First Row -->

            <button
                class="special"
                onclick="allClear()">
                AC
            </button>


            <button
                class="special"
                onclick="clearEntry()">
                C
            </button>


            <button
                class="special"
                onclick="backspace()">
                ⌫
            </button>


            <button
                class="operator"
                onclick="percentage()">
                %
            </button>



            <!-- Second Row -->

            <button onclick="addNumber('7')">
                7
            </button>


            <button onclick="addNumber('8')">
                8
            </button>


            <button onclick="addNumber('9')">
                9
            </button>


            <button
                class="operator"
                onclick="addOperator('/')">
                ÷
            </button>



            <!-- Third Row -->

            <button onclick="addNumber('4')">
                4
            </button>


            <button onclick="addNumber('5')">
                5
            </button>


            <button onclick="addNumber('6')">
                6
            </button>


            <button
                class="operator"
                onclick="addOperator('*')">
                ×
            </button>



            <!-- Fourth Row -->

            <button onclick="addNumber('1')">
                1
            </button>


            <button onclick="addNumber('2')">
                2
            </button>


            <button onclick="addNumber('3')">
                3
            </button>


            <button
                class="operator"
                onclick="addOperator('-')">
                −
            </button>



            <!-- Fifth Row -->

            <button
                class="zero"
                onclick="addNumber('0')">
                0
            </button>


            <button onclick="addDecimal()">
                .
            </button>


            <button
                class="equals"
                onclick="calculate()">
                =
            </button>


            <button
                class="operator"
                onclick="addOperator('+')">
                +
            </button>

        </div>



        <!-- Backend Status -->

        <p id="status">
            Backend: Connected
        </p>



        <!-- History -->

        <div class="history">


            <div class="history-header">

                <h3>Calculation History</h3>


                <button
                    class="clear-history"
                    onclick="clearHistory()">
                    Clear
                </button>

            </div>


            <div id="history-list">

                <p class="empty-history">
                    No calculations yet
                </p>

            </div>


        </div>


    </div>


    <script src="script.js"></script>

</body>

</html>
